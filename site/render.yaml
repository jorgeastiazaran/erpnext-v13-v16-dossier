services:
  - type: web
    name: erpnext-migration-dossier
    runtime: node
    plan: free
    buildCommand: cd site && npm install
    startCommand: cd site && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: erpnext-dossier-db
          property: connectionString

databases:
  - name: erpnext-dossier-db
    databaseName: erpnext_dossier
    user: dossier_user
    plan: free
