<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dossier interactivo de migración ERPNext v13 a v16 — Guías por módulo con tracking de pruebas UAT">
  <title>Dossier de Migración ERPNext v13 → v16</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Evaluator Modal -->
  <div id="evaluator-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-icon">👋</div>
        <h2>Bienvenido al Dossier de Migración</h2>
        <p>ERPNext v13 → v16</p>
      </div>
      <div class="modal-body">
        <label for="evaluator-name">Tu nombre (evaluador)</label>
        <input type="text" id="evaluator-name" placeholder="Ej: Juan Pérez" autocomplete="name">
        <p class="modal-hint">Este nombre se usará para registrar tus resultados de pruebas.</p>
      </div>
      <div class="modal-footer">
        <button id="evaluator-submit" class="btn btn-primary" disabled>Comenzar</button>
      </div>
    </div>
  </div>

  <!-- App Layout -->
  <div id="app" class="app-layout" style="display:none;">
    <!-- Mobile Header -->
    <header class="mobile-header">
      <button id="sidebar-toggle" class="btn-icon" aria-label="Menú">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="mobile-title">Dossier ERPNext</span>
      <div class="evaluator-badge" id="mobile-evaluator-badge"></div>
    </header>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">🔄</div>
          <div class="logo-text">
            <span class="logo-title">ERPNext</span>
            <span class="logo-subtitle">v13 → v16</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Populated by JS -->
      </nav>

      <div class="sidebar-footer">
        <div class="evaluator-info">
          <div class="evaluator-avatar" id="evaluator-avatar"></div>
          <div class="evaluator-details">
            <span class="evaluator-name-display" id="evaluator-name-display"></span>
            <span class="evaluator-role">Evaluador</span>
          </div>
          <button class="btn-icon btn-change-user" id="change-evaluator" title="Cambiar evaluador">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </button>
        </div>
        <button class="btn btn-export" id="btn-export">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Exportar CSV
        </button>
      </div>
    </aside>

    <!-- Sidebar overlay for mobile -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Dashboard (default view) -->
      <div id="dashboard-view" class="view">
        <div class="page-header">
          <h1>Dashboard de Progreso</h1>
          <p class="page-description">Resumen del avance de pruebas UAT por módulo</p>
        </div>
        <div class="dashboard-grid" id="dashboard-grid">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Document view -->
      <div id="doc-view" class="view" style="display:none;">
        <div class="doc-header" id="doc-header">
          <!-- Populated by JS -->
        </div>
        <article class="doc-content" id="doc-content">
          <!-- Populated by JS -->
        </article>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
